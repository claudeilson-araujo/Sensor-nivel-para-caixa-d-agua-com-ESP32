substitutions:
  nome: caixas-dagua

  # ---- Calibração: distância do sensor até a água, em metros ----
  # "cheia" = água no nível máximo | "vazia" = nível mínimo útil
  c1_dist_cheia: "0.30"
  c1_dist_vazia: "1.20"
  c2_dist_cheia: "0.30"
  c2_dist_vazia: "1.20"
  cist_dist_cheia: "0.30"
  cist_dist_vazia: "1.80"

  # ---- Regras de operação ----
  nivel_liga: "30"       # % da caixa: liga a bomba abaixo disso
  nivel_desliga: "95"    # % da caixa: desliga a bomba acima disso
  cist_nivel_min: "15"   # % da cisterna: abaixo disso, bomba bloqueada
  tempo_max_min: "30"    # minutos de funcionamento contínuo (proteção)
  pausa_min_min: "2"     # minutos mínimos entre partidas

esphome:
  name: ${nome}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "caixas-dagua-fallback"
    password: !secret ap_password

captive_portal:

# Guarda quando cada bomba ligou/desligou e se houve falha por tempo excedido
globals:
  - id: inicio_b1
    type: uint32_t
    initial_value: "0"
  - id: fim_b1
    type: uint32_t
    initial_value: "0"
  - id: falha_b1
    type: bool
    initial_value: "false"
  - id: inicio_b2
    type: uint32_t
    initial_value: "0"
  - id: fim_b2
    type: uint32_t
    initial_value: "0"
  - id: falha_b2
    type: bool
    initial_value: "false"

# ---------------------------------------------------------------
# Sensores
# IMPORTANTE: o pino ECHO do JSN-SR04T entrega 5 V. Use um divisor
# de tensão (1 kΩ em série + 2 kΩ para o GND) antes de entrar no ESP32.
# ---------------------------------------------------------------
sensor:
  - platform: ultrasonic
    id: dist_c1
    name: "Caixa 1 distância"
    trigger_pin: GPIO25
    echo_pin: GPIO26
    timeout: 3m
    update_interval: 3s
    unit_of_measurement: "m"
    accuracy_decimals: 3
    filters:
      - median:
          window_size: 5
          send_every: 2
          send_first_at: 3

  - platform: ultrasonic
    id: dist_c2
    name: "Caixa 2 distância"
    trigger_pin: GPIO18
    echo_pin: GPIO19
    timeout: 3m
    update_interval: 3s
    unit_of_measurement: "m"
    accuracy_decimals: 3
    filters:
      - median:
          window_size: 5
          send_every: 2
          send_first_at: 3

  - platform: ultrasonic
    id: dist_cist
    name: "Cisterna distância"
    trigger_pin: GPIO16
    echo_pin: GPIO17
    timeout: 4m
    update_interval: 3s
    unit_of_measurement: "m"
    accuracy_decimals: 3
    filters:
      - median:
          window_size: 5
          send_every: 2
          send_first_at: 3

  # Distância -> nível em %
  - platform: template
    id: nivel_c1
    name: "Caixa 1 nível"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (isnan(id(dist_c1).state)) return NAN;
      float p = (${c1_dist_vazia} - id(dist_c1).state) / (${c1_dist_vazia} - ${c1_dist_cheia}) * 100.0;
      return max(0.0f, min(100.0f, p));

  - platform: template
    id: nivel_c2
    name: "Caixa 2 nível"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (isnan(id(dist_c2).state)) return NAN;
      float p = (${c2_dist_vazia} - id(dist_c2).state) / (${c2_dist_vazia} - ${c2_dist_cheia}) * 100.0;
      return max(0.0f, min(100.0f, p));

  - platform: template
    id: nivel_cist
    name: "Cisterna nível"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (isnan(id(dist_cist).state)) return NAN;
      float p = (${cist_dist_vazia} - id(dist_cist).state) / (${cist_dist_vazia} - ${cist_dist_cheia}) * 100.0;
      return max(0.0f, min(100.0f, p));

# ---------------------------------------------------------------
# Relés (módulo ativo em nível baixo -> inverted: true)
# Cada relé aciona a BOBINA de um contator, nunca a bomba direto.
# ---------------------------------------------------------------
switch:
  - platform: gpio
    id: rele_b1
    name: "Bomba 1"
    pin:
      number: GPIO22
      inverted: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: id(inicio_b1) = millis();
    on_turn_off:
      - lambda: id(fim_b1) = millis();

  - platform: gpio
    id: rele_b2
    name: "Bomba 2"
    pin:
      number: GPIO23
      inverted: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: id(inicio_b2) = millis();
    on_turn_off:
      - lambda: id(fim_b2) = millis();

  # Modo automático (começa DESLIGADO: só liga quando você ativar)
  - platform: template
    id: auto_b1
    name: "Bomba 1 automático"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: auto_b2
    name: "Bomba 2 automático"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# ---------------------------------------------------------------
# Lógica de controle (a cada 5 s)
# ---------------------------------------------------------------
interval:
  - interval: 5s
    then:
      - lambda: |-
          const uint32_t agora = millis();
          const float cist = id(nivel_cist).state;
          const bool cist_ok = !isnan(cist) && cist >= ${cist_nivel_min};

          // ----- Bomba 1 -----
          {
            const float n = id(nivel_c1).state;
            if (id(rele_b1).state) {
              bool desligar = false;
              if (!cist_ok) desligar = true;
              if (id(auto_b1).state && !isnan(n) && n >= ${nivel_desliga}) desligar = true;
              if (agora - id(inicio_b1) > ${tempo_max_min} * 60000UL) {
                desligar = true;
                id(falha_b1) = true;
              }
              if (desligar) id(rele_b1).turn_off();
            } else if (id(auto_b1).state && !id(falha_b1) && cist_ok
                       && !isnan(n) && n <= ${nivel_liga}
                       && (agora - id(fim_b1)) > ${pausa_min_min} * 60000UL) {
              id(rele_b1).turn_on();
            }
          }

          // ----- Bomba 2 -----
          {
            const float n = id(nivel_c2).state;
            if (id(rele_b2).state) {
              bool desligar = false;
              if (!cist_ok) desligar = true;
              if (id(auto_b2).state && !isnan(n) && n >= ${nivel_desliga}) desligar = true;
              if (agora - id(inicio_b2) > ${tempo_max_min} * 60000UL) {
                desligar = true;
                id(falha_b2) = true;
              }
              if (desligar) id(rele_b2).turn_off();
            } else if (id(auto_b2).state && !id(falha_b2) && cist_ok
                       && !isnan(n) && n <= ${nivel_liga}
                       && (agora - id(fim_b2)) > ${pausa_min_min} * 60000UL) {
              id(rele_b2).turn_on();
            }
          }

# ---------------------------------------------------------------
# Alertas e reset de falhas
# ---------------------------------------------------------------
binary_sensor:
  - platform: template
    name: "Cisterna baixa"
    device_class: problem
    lambda: |-
      return isnan(id(nivel_cist).state) || id(nivel_cist).state < ${cist_nivel_min};

  - platform: template
    name: "Bomba 1 falha (tempo excedido)"
    device_class: problem
    lambda: return id(falha_b1);

  - platform: template
    name: "Bomba 2 falha (tempo excedido)"
    device_class: problem
    lambda: return id(falha_b2);

button:
  - platform: template
    name: "Resetar falhas das bombas"
    on_press:
      - lambda: |-
          id(falha_b1) = false;
          id(falha_b2) = false;

# ---------------------------------------------------------------
# Display OLED 0,96" I2C (SSD1306 128x64)
# Ligação: VCC -> 3,3 V | GND -> GND | SDA -> GPIO21 | SCL -> GPIO27
# (o SCL padrão, GPIO22, já é usado pelo relé da bomba 1)
# ---------------------------------------------------------------
i2c:
  sda: GPIO21
  scl: GPIO27
  scan: true

font:
  - file: "gfonts://Roboto"
    id: fonte
    size: 12

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 2s
    lambda: |-
      // Linha com nome, porcentagem, barra e marcador de bomba ligada
      auto linha = [&](int y, const char *nome, float n, bool bomba_on) {
        it.printf(0, y, id(fonte), "%s", nome);
        if (isnan(n)) {
          it.printf(30, y, id(fonte), "--");
          return;
        }
        it.printf(30, y, id(fonte), "%.0f%%", n);
        it.rectangle(66, y + 3, 42, 8);
        it.filled_rectangle(66, y + 3, (int) (n * 0.42f), 8);
        if (bomba_on) it.printf(112, y, id(fonte), "ON");
      };

      linha(0,  "Cx1",  id(nivel_c1).state,   id(rele_b1).state);
      linha(15, "Cx2",  id(nivel_c2).state,   id(rele_b2).state);
      linha(30, "Cist", id(nivel_cist).state, false);

      // Rodapé de status
      const float c = id(nivel_cist).state;
      if (id(falha_b1) || id(falha_b2)) {
        it.printf(0, 50, id(fonte), "FALHA NA BOMBA");
      } else if (isnan(c) || c < ${cist_nivel_min}) {
        it.printf(0, 50, id(fonte), "CISTERNA BAIXA");
      } else {
        it.printf(0, 50, id(fonte), "Sistema OK");
      }
